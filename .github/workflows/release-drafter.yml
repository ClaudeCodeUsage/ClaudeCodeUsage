# Drafts the next GitHub Release as changes land on main.
#
# On every push to main, release-drafter (re)builds a single DRAFT Release with
# categorised notes and the next semver version inferred from the merged PRs'
# labels (config in .github/release-drafter.yml). A second pass after a PR is
# fully merged closes the small event-ordering window where the push can arrive
# before GitHub exposes that PR as merged. Nothing is published here — the
# maintainer reviews the draft and clicks "Publish release" when ready, which
# creates the tag and triggers publish.yml.
#
# On PRs a separate v7 action autolabels (title/branch -> version label; config in
# .github/release-drafter.yml) so the draft's version + categories are right
# without a manual label. It runs on `pull_request_target` (not `pull_request`)
# so the token can write labels even on fork PRs — the autolabeler reads PR
# metadata, never checks out or runs the PR's code. A maintainer can
# still override the label before merge (unlabeled defaults to patch).

name: Release Drafter

on:
  push:
    branches: [main]
  # Autolabel PRs (title/branch -> version label) so the draft's next version and
  # categories are right without a manual label. `pull_request_target` so the
  # token has write access even for fork PRs. Title edits are relabeled too;
  # only a merged closure reconciles the draft after the main push race.
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, closed]

permissions:
  contents: read

jobs:
  autolabel:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == 'main' &&
      (github.event.action == 'opened' || github.event.action == 'reopened' ||
       github.event.action == 'synchronize' || github.event.action == 'edited')
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          config-name: release-drafter.yml@main

  update_release_draft:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main')
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          config-name: release-drafter.yml@main
          commitish: main
          publish: 'false'
