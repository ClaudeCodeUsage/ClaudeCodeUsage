# Run the release-quality gates on every push and pull request.
#
# What this does:
#   1. Runs the compiled Node logic and repository-policy suite.
#   2. Runs the complete Webview gate in the canonical Playwright container.
#   3. Packages and verifies a smoke VSIX only after both test jobs pass.
#
# To block merging, require all three checks under the repository's branch
# protection rules: Test / Node Tests, Test / UI Test, and Test / Release Package.

name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            .github/build-tools/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install locked build tools
        run: npm ci --prefix .github/build-tools --ignore-scripts
      - name: Audit root dependencies
        run: npm audit --audit-level=high --ignore-scripts
      - name: Audit build tools
        run: npm audit --prefix .github/build-tools --audit-level=high --ignore-scripts
      - name: Run Node tests
        run: npm test
      - name: Setup Node.js for native Zstd coverage
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify native compressed-log compatibility
        run: |
          node -e "if (!require('./out/providers/codex/codexZstd').supportsCodexZstd()) throw new Error('Native Zstd is unavailable')"
          node --test out/test/codexZstd.test.js out/test/codexManifest.test.js out/test/codexCompressed*.test.js

  ui_shards:
    name: UI Shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run full Webview gate
        run: npm run test:ui -- --fully-parallel --workers=1 --shard=${{ matrix.shard }}/4

  # Preserve the stable required check and fail closed on any failed,
  # cancelled or skipped shard. Each shard has its own VM/server/storage.
  ui:
    name: UI Test
    needs: [ui_shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every UI shard to pass
        run: test '${{ needs.ui_shards.result }}' = 'success'

  package:
    name: Release Package
    needs: [test, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            .github/build-tools/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install locked build tools
        run: npm ci --prefix .github/build-tools --ignore-scripts
      - name: Compile
        run: npm run compile
      - name: Package smoke VSIX
        run: .github/build-tools/node_modules/.bin/vsce package --out /tmp/claude-code-usage-ci.vsix
      - name: Verify smoke VSIX
        run: node .github/scripts/verify-vsix.mjs /tmp/claude-code-usage-ci.vsix
