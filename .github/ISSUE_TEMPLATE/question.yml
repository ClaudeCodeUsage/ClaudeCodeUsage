name: ❓ Question / Support
description: Ask how something works, or get help with setup.
title: "[Question]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Ask about Claude Code, Codex or shared features here. The README's Configuration and Troubleshooting sections cover setup, token meanings, API-equivalent estimates, quota observations and local history.

        Do not post conversation logs, credentials, account details, session IDs or personal paths. If diagnostics help, use only relevant, redacted lines from **Show Diagnostic Logs**; a diagnostic dump is not required.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I checked the README (Configuration + Troubleshooting) and searched [existing issues](../../issues?q=is%3Aissue).
          required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider or scope (optional)
      options:
        - Claude Code
        - Codex
        - Both / shared feature
        - Not sure / general
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What would you like to know, or get working?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Steps you took and the result. For number differences, include the date range and indexing status; use only redacted diagnostics if relevant.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Installed Claude Code Usage and provider-client versions, VS Code version, OS or remote setup, and the relevant view—only what helps explain the question. No secrets or raw logs.
