name: 🐞 Bug report
description: Report something that isn't working as expected — wrong numbers, a crash, or a UI glitch.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report Claude Code or Codex issues here. Include the installed version, affected provider and where the problem appears; leave unrelated optional fields blank. API-equivalent estimates are not bills or official subscription balances.

        If useful, run **Show Diagnostic Logs** from the Command Palette and share only relevant, redacted lines below. Do not upload conversation logs (including `.jsonl` or `.jsonl.zst`), credentials, account details, session IDs or personal paths. Check screenshots and profiles for private information too.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      description: A few quick checks that catch most already-known issues.
      options:
        - label: I searched [existing issues](../../issues?q=is%3Aissue) and didn't find a duplicate.
          required: true
        - label: I'm on the latest version of the extension, or I've written my version below.
          required: true
        - label: I read the README's Troubleshooting section (proxies, history retention, the AI advice feature).
          required: false
  - type: dropdown
    id: provider
    attributes:
      label: Affected provider
      options:
        - Claude Code
        - Codex
        - Both providers
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen? (optional)
      options:
        - Status bar / quota
        - Usage dashboard / history
        - Achievements / recalibration
        - Sharing / export
        - AI advice
        - Refresh / CPU / memory / crash
        - Settings / installation
        - Other / not sure
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you saw. For wrong totals, include the provider, date range and whether indexing was complete; do not paste source logs.
      placeholder: Codex All time shows less history after an update, although indexing reports complete.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact steps to trigger it. "I can't reliably reproduce it" is a valid answer — if so, describe when it tends to happen.
      placeholder: |
        1. Run Show Usage Details from the Command Palette
        2. Select the provider and affected tab
        3. …
  - type: input
    id: ext-version
    attributes:
      label: Extension version
      description: The installed version in the Extensions sidebar, not just the latest Marketplace version. Mention a test VSIX if applicable.
      placeholder: e.g. 2.5.0
    validations:
      required: true
  - type: input
    id: cc-version
    attributes:
      label: Provider client and version (optional)
      description: >-
        Claude Code: use claude --version. Codex: name the desktop app, CLI or VS Code extension and its installed version. This is separate from the Claude Code Usage version above.
      placeholder: Provider client name and installed version
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      description: Help → About (Code → About on macOS).
      placeholder: Installed version; mention Insiders if applicable
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Remote / containerised (SSH, devcontainer, WSL, Codespaces)
        - Not sure
    validations:
      required: true
  - type: input
    id: proxy
    attributes:
      label: Model / connection setup (optional)
      description: Name the model and connection type if relevant. Omit private endpoint URLs, account identifiers and keys.
      placeholder: e.g. native Anthropic / Bedrock / proxy; Codex app / CLI / extension
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic logs (optional, redacted)
      description: Relevant anonymous `refresh:` lines or error categories from Show Diagnostic Logs, if available. Remove private details; do not paste the entire output channel or attach source logs. You can submit without diagnostics.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: For UI bugs, include theme, approximate width/zoom and a redacted screenshot. For remote setups, say where the extension runs. For performance issues, approximate history size and a redacted CPU profile may help; do not upload conversation content.
