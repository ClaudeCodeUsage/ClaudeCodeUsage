name: 💡 Feature request
description: Suggest a new capability or an improvement to an existing one.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions for Claude Code, Codex and shared features are welcome. The project is local-first, lightweight and focused on truthful usage, quota observations and optional advice—not full billing reconciliation. Explain the user need and current workaround; a feature request does not need an implementation plan.

        Do not include conversation logs, credentials, account details or personal paths. Redact screenshots and examples before posting.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched [existing issues](../../issues?q=is%3Aissue) and didn't find this request.
          required: true
        - label: This fits the local-first Claude Code / Codex usage-tracking scope.
          required: false
  - type: dropdown
    id: provider
    attributes:
      label: Provider or scope (optional)
      options:
        - Claude Code
        - Codex
        - Both / shared feature
        - Not sure / general
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the underlying need, not just the solution. What are you trying to understand or do that the extension makes hard today?
      placeholder: I can't tell which of my installed skills are actually worth the context they cost me.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change for the user? Mention the relevant view or control, sensible defaults and unavailable-data behavior if relevant. A short description is enough.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other approaches, existing workarounds, or other tools — and why they fall short.
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Sketches and examples are optional; issue reporters are not required to generate design images. For a new visual system, design comparison and maintainer approval happen before implementation through the contributor workflow. Redact private details.
